services:
  - type: web
    name: backend_YOS
    env: docker
    plan: starter
    region: ohio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: YOS_Db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: my-cache
          property: connectionString
      - key: DEBUG
        value: "False"

  - type: redis
    name: my-cache
    ipAllowList: [] # Only allow internal traffic

databases:
  - name: YOS_Db
    plan: basic